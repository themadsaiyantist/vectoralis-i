name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Every guard proves itself
        run: python plugins/light/bin/vectoralis guards
      - name: The records and the writing rules
        run: |
          python plugins/light/bin/vectoralis check
          python tools/check_writing.py
